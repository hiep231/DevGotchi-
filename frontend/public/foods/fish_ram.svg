    <!-- Pill Highlight -->
    <rect x="28" y="19" width="12" height="3" rx="1.5" fill="#FFFFFF" opacity="0.8" transform="rotate(-5 28 19)"/>
    <!-- RAM Chip Plate (Center) -->
    <rect x="29" y="24" width="16" height="14" rx="3" fill="#10B981" stroke="#1B2A4A" stroke-width="2"/>
    <!-- Gold RAM Contacts (Pins) -->
    <rect x="31" y="38" width="2" height="3" rx="0.5" fill="#F59E0B" stroke="#1B2A4A" stroke-width="1"/>
    <rect x="35" y="38" width="2" height="3" rx="0.5" fill="#F59E0B" stroke="#1B2A4A" stroke-width="1"/>
    <rect x="39" y="38" width="2" height="3" rx="0.5" fill="#F59E0B" stroke="#1B2A4A" stroke-width="1"/>
    <rect x="43" y="38" width="2" height="3" rx="0.5" fill="#F59E0B" stroke="#1B2A4A" stroke-width="1"/>
    <!-- RAM Modules -->
    <rect x="31.5" y="27" width="4.5" height="4.5" rx="1" fill="#047857"/>
    <rect x="38.5" y="27" width="4.5" height="4.5" rx="1" fill="#047857"/>
    <!-- Fish Eye -->
    <circle cx="51" cy="27" r="3.8" fill="#1B2A4A"/>
    <circle cx="52.2" cy="25.8" r="1.3" fill="#FFFFFF"/>
    <!-- Rosy Cheek -->
