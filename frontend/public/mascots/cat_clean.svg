<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" fill="none">
  <!-- Ground Shadow -->
  <ellipse cx="150" cy="285" rx="64" ry="9" fill="#1B2A4A" opacity="0.16"/>
  <!-- Rig Group -->
  <g id="rig">
    <!-- Curly Bracket Tail -->
    <path d="M200 248 C252 254 266 204 240 188 C227 180 214 194 226 202" fill="none" stroke="#1B2A4A" stroke-width="22" stroke-linecap="round"/>
    <path d="M200 248 C252 254 266 204 240 188 C227 180 214 194 226 202" fill="none" stroke="#B79CF0" stroke-width="12" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="150" cy="228" rx="60" ry="54" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="150" cy="240" rx="34" ry="36" fill="#FFF1D6"/>
    <!-- Arms -->
    <ellipse cx="93" cy="234" rx="11" ry="20" transform="rotate(14 93 234)" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="207" cy="234" rx="11" ry="20" transform="rotate(-14 207 234)" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Feet -->
    <ellipse cx="124" cy="278" rx="21" ry="12" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="176" cy="278" rx="21" ry="12" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Head -->
    <g id="head">
      <!-- Ears -->
      <path d="M86 110 L76 46 Q75 37 84 41 L138 70Z" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M91 96 L86 62 L120 80Z" fill="#FF9FB8"/>
      <path d="M214 110 L224 46 Q225 37 216 41 L162 70Z" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M209 96 L214 62 L180 80Z" fill="#FF9FB8"/>
      <!-- Head Base -->
      <ellipse cx="150" cy="124" rx="80" ry="66" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Headphone Band -->
      <path d="M72 124 C70 52 230 52 228 124" fill="none" stroke="#1B2A4A" stroke-width="14" stroke-linecap="round"/>
      <path d="M72 124 C70 52 230 52 228 124" fill="none" stroke="#4A5AA8" stroke-width="7" stroke-linecap="round"/>
      <!-- Headphone Ear Pads -->
      <ellipse cx="68" cy="126" rx="13" ry="21" fill="#FFE7B3" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="232" cy="126" rx="13" ry="21" fill="#FFE7B3" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Highlights -->
      <ellipse cx="98" cy="106" rx="14" ry="5" transform="rotate(-35 98 106)" fill="#fff" opacity="0.85"/>
      <circle cx="84" cy="120" r="3.5" fill="#fff" opacity="0.85"/>
      <!-- Muzzle -->
      <ellipse cx="150" cy="158" rx="27" ry="17" fill="#FFF1D6"/>
      <!-- Face -->
      <!-- Blush -->
      <ellipse cx="96" cy="152" rx="11" ry="6" fill="#FF8FA3" opacity="0.6"/>
      <ellipse cx="204" cy="152" rx="11" ry="6" fill="#FF8FA3" opacity="0.6"/>
      <!-- Nose -->
      <path d="M144 148 Q150 144 156 148 Q150 156 144 148Z" fill="#FF7F9C" stroke="#1B2A4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Eyes -->
      <ellipse cx="118" cy="134" rx="11" ry="14" fill="#1B2A4A"/>
      <circle cx="114.5" cy="128" r="4.6" fill="#fff"/>
      <circle cx="121.5" cy="139" r="2.3" fill="#fff"/>
      <ellipse cx="182" cy="134" rx="11" ry="14" fill="#1B2A4A"/>
      <circle cx="178.5" cy="128" r="4.6" fill="#fff"/>
      <circle cx="185.5" cy="139" r="2.3" fill="#fff"/>
      <!-- Mouth -->
      <path d="M138 162 Q144 170 150 162 Q156 170 162 162" fill="none" stroke="#1B2A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
