<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cache Cat – mascot vẽ bằng code</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6E5;--sky:#DFF4FF;--ink:#2D2A4A;--soft:#6B6890;--surface:#fff;--primary:#FFB703;--grape:#8E7CFF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1B33;--sky:#2F3A66;--ink:#F4EEFF;--soft:#B3AED6;--surface:#2A2745;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E1B33;--sky:#2F3A66;--ink:#F4EEFF;--soft:#B3AED6;--surface:#2A2745;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Nunito,ui-rounded,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 16px 28px}
h1{font:600 28px/1.1 Fredoka,ui-rounded,system-ui,sans-serif;margin:0}
.sub{margin:4px 0 0;color:var(--soft);font-size:14px;line-height:1.4;max-width:420px}
header{width:100%;max-width:420px}
.stage{position:relative;width:100%;max-width:420px;border:2px solid var(--ink);border-radius:24px;background:linear-gradient(180deg,var(--sky),var(--bg));box-shadow:0 4px 0 var(--ink);overflow:hidden;touch-action:manipulation}
svg{display:block;width:100%;height:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cloud{animation:drift 14s ease-in-out infinite alternate}
#c2{animation-duration:19s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translateX(22px)}}
.bubble{position:absolute;top:12%;right:7%;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:6px 12px;font:600 15px Fredoka,ui-rounded,system-ui,sans-serif;opacity:0;transform:translateY(6px) scale(.92);transition:opacity .18s,transform .18s;pointer-events:none}
.bubble.on{opacity:1;transform:none}
.moods{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:420px}
.chip{font:600 15px Fredoka,ui-rounded,system-ui,sans-serif;min-height:44px;padding:8px 16px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.chip[aria-pressed="true"]{background:var(--primary);color:#2D2A4A}
.chip:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.chip:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.hint{margin:0;max-width:420px;text-align:center;color:var(--soft);font-size:14px;line-height:1.4}
@media (prefers-reduced-motion:reduce){.cloud{animation:none}.bubble{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Cache Cat</h1>
  <p class="sub">Hay quên nhưng đáng yêu. Vẽ hoàn toàn bằng SVG và code, không dùng ảnh.</p>
</header>

<div class="stage">
<svg id="svg" viewBox="0 0 300 330" role="img" aria-label="Cache Cat, chú mèo tím đeo tai nghe, mắt nhìn theo con trỏ">
  <g class="cloud" id="c1" opacity=".92"><ellipse cx="62" cy="54" rx="28" ry="11" fill="#fff"/><ellipse cx="82" cy="47" rx="17" ry="10" fill="#fff"/></g>
  <g class="cloud" id="c2" opacity=".92"><ellipse cx="236" cy="96" rx="24" ry="9" fill="#fff"/><ellipse cx="220" cy="90" rx="14" ry="8" fill="#fff"/></g>
  <ellipse cx="150" cy="298" rx="128" ry="26" fill="#7DD06F" stroke="#1B2A4A" stroke-width="4"/>
  <ellipse cx="150" cy="292" rx="112" ry="17" fill="#A2E58F"/>
  <ellipse id="shadow" cx="150" cy="291" rx="62" ry="8" fill="#4E9A45" opacity=".55"/>

  <g id="rig">
    <g id="tail">
      <path d="M200 252 C252 258 266 208 240 192 C227 184 214 198 226 206" fill="none" stroke="#1B2A4A" stroke-width="22" stroke-linecap="round"/>
      <path d="M200 252 C252 258 266 208 240 192 C227 184 214 198 226 206" fill="none" stroke="#B79CF0" stroke-width="12" stroke-linecap="round"/>
    </g>
    <g id="bodyg">
      <ellipse cx="150" cy="232" rx="60" ry="54" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5"/>
      <ellipse cx="150" cy="244" rx="34" ry="36" fill="#FFF1D6"/>
      <ellipse cx="93" cy="238" rx="11" ry="20" transform="rotate(14 93 238)" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5"/>
      <ellipse cx="207" cy="238" rx="11" ry="20" transform="rotate(-14 207 238)" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5"/>
    </g>
    <ellipse cx="124" cy="282" rx="21" ry="12" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5"/>
    <ellipse cx="176" cy="282" rx="21" ry="12" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5"/>

    <g id="headg">
      <g id="earL">
        <path d="M86 114 L76 50 Q75 41 84 45 L138 74 Z" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5" stroke-linejoin="round"/>
        <path d="M91 100 L86 66 L120 84 Z" fill="#FF9FB8"/>
      </g>
      <g id="earR">
        <path d="M214 114 L224 50 Q225 41 216 45 L162 74 Z" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5" stroke-linejoin="round"/>
        <path d="M209 100 L214 66 L180 84 Z" fill="#FF9FB8"/>
      </g>
      <ellipse cx="150" cy="128" rx="80" ry="66" fill="#B79CF0" stroke="#1B2A4A" stroke-width="5"/>
      <path d="M72 128 C70 56 230 56 228 128" fill="none" stroke="#1B2A4A" stroke-width="14" stroke-linecap="round"/>
      <path d="M72 128 C70 56 230 56 228 128" fill="none" stroke="#4A5AA8" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="68" cy="130" rx="13" ry="21" fill="#FFE7B3" stroke="#1B2A4A" stroke-width="5"/>
      <ellipse cx="232" cy="130" rx="13" ry="21" fill="#FFE7B3" stroke="#1B2A4A" stroke-width="5"/>
      <ellipse cx="98" cy="110" rx="14" ry="5" transform="rotate(-35 98 110)" fill="#fff" opacity=".85"/>
      <circle cx="84" cy="124" r="3.5" fill="#fff" opacity=".85"/>
      <ellipse cx="150" cy="162" rx="27" ry="17" fill="#FFF1D6"/>
      <g id="face">
        <ellipse cx="96" cy="156" rx="11" ry="6" fill="#FF8FA3" opacity=".6"/>
        <ellipse cx="204" cy="156" rx="11" ry="6" fill="#FF8FA3" opacity=".6"/>
        <path d="M144 152 Q150 148 156 152 Q150 160 144 152Z" fill="#FF7F9C" stroke="#1B2A4A" stroke-width="2.5" stroke-linejoin="round"/>
        <g id="eyes"></g>
        <g id="mouth"></g>
        <g id="extra"></g>
      </g>
    </g>
  </g>
</svg>
<div class="bubble" id="bubble" role="status"></div>
</div>

<div class="moods" role="group" aria-label="Biểu cảm">
  <button class="chip" data-m="idle">Bình thường</button>
  <button class="chip" data-m="happy">Vui</button>
  <button class="chip" data-m="hungry">Đói</button>
  <button class="chip" data-m="sleepy">Buồn ngủ</button>
  <button class="chip" data-m="eating">Đang ăn</button>
</div>
<p class="hint">Di chuột hoặc chạm lên màn hình để bé nhìn theo. Chạm vào bé để chọc.</p>

<script>
const $ = s => document.querySelector(s), INK = '#1B2A4A';
const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const el = {rig:$('#rig'),tail:$('#tail'),body:$('#bodyg'),head:$('#headg'),eL:$('#earL'),eR:$('#earR'),face:$('#face'),eyes:$('#eyes'),mouth:$('#mouth'),extra:$('#extra'),shadow:$('#shadow'),bub:$('#bubble'),svg:$('#svg')};
const st = (w = 5) => `stroke="${INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
const both = f => [118, 182].map(f).join('');
const dot = x => `<g class="eye" data-cx="${x}" data-cy="138"><ellipse cx="${x}" cy="138" rx="11" ry="14" fill="${INK}"/><circle class="hl" cx="${x-3.5}" cy="132" r="4.6" fill="#fff"/><circle class="hl" cx="${x+3.5}" cy="143" r="2.3" fill="#fff"/></g>`;
const arc = d => x => `<g class="eye" data-cx="${x}" data-cy="138"><path d="M${x-12} ${138+d} Q${x} ${138-d*1.6} ${x+12} ${138+d}" fill="none" ${st(5.5)}/></g>`;
const star = x => `<g class="eye" data-cx="${x}" data-cy="138"><path transform="translate(${x} 138)" d="M0-15L4-4 15 0 4 4 0 15-4 4-15 0-4-4Z" fill="#FFD166" ${st(2.5)}/></g>`;
const RED = '#E8505B';
const MOODS = {
  idle:   {e:both(dot), m:`<path d="M138 166 Q144 174 150 166 Q156 174 162 166" fill="none" ${st(3)}/>`, x:'', say:'Meo~'},
  happy:  {e:both(arc(7)), m:`<path d="M139 165 Q150 184 161 165Z" fill="${RED}" ${st(3)}/>`, x:'', say:'Hihi!'},
  hungry: {e:both(dot), m:`<ellipse cx="150" cy="170" rx="7" ry="6" fill="${RED}" ${st(3)}/>`,
          x:`<path d="M103 120 L131 128 M197 120 L169 128" fill="none" ${st(5)}/><path d="M196 88 q6 2 6 8 M214 88 q-6 2 -6 8 M196 104 q6 -2 6 -8 M214 104 q-6 -2 -6 -8" fill="none" stroke="${RED}" stroke-width="3.5" stroke-linecap="round"/>`, say:'Đói quá!'},
  sleepy: {e:both(arc(-5)), m:`<ellipse cx="150" cy="169" rx="4" ry="3.5" fill="none" ${st(3)}/>`,
          x:`<text x="206" y="94" font-family="Fredoka,sans-serif" font-weight="600" font-size="24" fill="#6B6890">Z</text><text x="228" y="72" font-family="Fredoka,sans-serif" font-weight="600" font-size="16" fill="#6B6890">z</text>`, say:'Zzz…'},
  eating: {e:both(star), m:`<path d="M136 164 Q150 190 164 164Z" fill="${RED}" ${st(3)}/>`, x:'', say:'Ngon ghê!'}
};
const TAPS = ['Nhột quá!', 'Hihi!', 'Meo~', 'Cho ăn đi!'];

let gx = 0, gy = 0, tx = 0, ty = 0, lastPtr = -1e9, nextGlance = 0, sq = -1e9, twitch = 0, nextBlink = 2500, blinkAt = -1e9, mood = 'idle', raf, bubT;
const clamp = v => Math.max(-1, Math.min(1, v));
function aim(x, y) {
  const r = el.svg.getBoundingClientRect();
  tx = clamp((x - (r.left + r.width / 2)) / (r.width * .6));
  ty = clamp((y - (r.top + r.height * .4)) / (r.height * .6));
  lastPtr = performance.now();
}
addEventListener('pointermove', e => aim(e.clientX, e.clientY), {passive:true});
addEventListener('pointerdown', e => aim(e.clientX, e.clientY), {passive:true});

function say(t) {
  el.bub.textContent = t; el.bub.classList.add('on');
  clearTimeout(bubT); bubT = setTimeout(() => el.bub.classList.remove('on'), 1600);
}
function setMood(m) {
  mood = m; const d = MOODS[m];
  el.eyes.innerHTML = d.e; el.mouth.innerHTML = d.m; el.extra.innerHTML = d.x;
  document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
  say(d.say);
  if (m === 'eating' || m === 'happy') { sq = performance.now(); twitch = 1; }
}
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => setMood(b.dataset.m)));
el.svg.addEventListener('click', () => {
  sq = performance.now(); twitch = 1;
  try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light'); } catch (e) {}
  say(TAPS[Math.floor(Math.random() * TAPS.length)]);
});

function frame(t) {
  const s = t / 1000, k = rm ? 0 : 1;
  if (t - lastPtr > 3000 && t > nextGlance) {
    tx = (Math.random() * 2 - 1) * .9; ty = (Math.random() * 2 - 1) * .5;
    nextGlance = t + 1800 + Math.random() * 2200;
  }
  gx += (tx - gx) * .15; gy += (ty - gy) * .15;
  const br = 1 + .022 * Math.sin(s * 2.1) * k, fy = Math.sin(s * 1.5) * 3 * k;
  const e = (t - sq) / 380, on = e >= 0 && e < 1;
  const q = on ? Math.sin(e * Math.PI * 2) * (1 - e) : 0, jump = on ? 12 * Math.sin(e * Math.PI) : 0;
  el.rig.setAttribute('transform', `translate(0 ${fy - jump}) translate(150 286) scale(${1 + .07 * q} ${1 - .1 * q}) translate(-150 -286)`);
  el.body.setAttribute('transform', `translate(150 286) scale(1 ${br}) translate(-150 -286)`);
  el.head.setAttribute('transform', `translate(${gx * 2} ${-(br - 1) * 70 + gy * 1.5}) rotate(${gx * 3.5} 150 190)`);
  el.face.setAttribute('transform', `translate(${gx * 3.5} ${gy * 2.5})`);
  el.eyes.setAttribute('transform', `translate(${gx * 3} ${gy * 2})`);
  el.tail.setAttribute('transform', `rotate(${Math.sin(s * 2.4) * 9 * k + (mood === 'hungry' ? -8 : 0)} 204 250)`);
  twitch *= .93;
  const ta = Math.sin(t / 35) * 9 * twitch;
  el.eL.setAttribute('transform', `rotate(${ta} 112 100)`);
  el.eR.setAttribute('transform', `rotate(${-ta} 188 100)`);
  el.shadow.setAttribute('rx', 62 * (1 + (fy - jump) / 80));
  if (t > nextBlink && !rm) { blinkAt = t; nextBlink = t + 3000 + Math.random() * 3000; }
  const b = (t - blinkAt) / 140, sc = b >= 0 && b < 1 ? 1 - .9 * Math.sin(b * Math.PI) : 1;
  el.eyes.querySelectorAll('.eye').forEach(g => {
    const x = g.dataset.cx, y = g.dataset.cy;
    g.setAttribute('transform', `translate(${x} ${y}) scale(1 ${sc}) translate(${-x} ${-y})`);
  });
  el.eyes.querySelectorAll('.hl').forEach(h => h.setAttribute('transform', `translate(${-gx * .9} ${-gy * .9})`));
  raf = requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(raf); else raf = requestAnimationFrame(frame);
});
setMood('idle');
raf = requestAnimationFrame(frame);
</script>
</body>
</html>
